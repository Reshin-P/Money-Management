# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: devreshi
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: money
# "service" is the name of this project. This will also be added to your AWS resource names.
service: money
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'develop'}
  region: us-east-1
  lambdaHashingVersion: "20201221"
  environment:
    DYNAMODB_TABLE: ${self:service}-${sls:stage}
    TEST_VAR: "test reshi"
    USERS_TABLE: ${self:custom.userTableName}
    EXPENCE_TABLE: ${self:custom.expenceTableName}
    INCOME_TABLE: ${self:custom.incomeTableName}
    TRANSACTION_TABLE: transactionTable-${opt:stage,self:provider.stage}
  httpApi:
    cors: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:539247476813:table/${self:custom.userTableName}"
            - "arn:aws:dynamodb:${self:provider.region}:539247476813:table/${self:custom.expenceTableName}"
            - "arn:aws:dynamodb:${self:provider.region}:539247476813:table/${self:custom.incomeTableName}"
            - "arn:aws:dynamodb:${self:provider.region}:539247476813:table/transactionTable-${opt:stage,self:provider.stage}"

custom:
  userTableName: usersTable-${opt:stage,self:provider.stage}
  incomeTableName: incomeTable-${opt:stage,self:provider.stage}
  expenceTableName: expenceTable-${opt:stage,self:provider.stage}
  serverless-offline:
    port: 4000
plugins:
  - serverless-offline

functions:
  hello:
    handler: handler.hello
    events:
      - httpApi:
          path: /
          method: get
  register:
    handler: src/handlers/user/user.register
    events:
      - httpApi:
          path: /register
          method: post
  login:
    handler: src/handlers/user/user.login
    events:
      - httpApi:
          path: /login
          method: post
  getUserDetails:
    handler: src/handlers/user/user.getUserDetails
    events:
      - httpApi:
          path: /getUserDetails/{email}
          method: GET
  addExpense:
    handler: src/handlers/expense/expense.addExpense
    events:
      - httpApi:
          path: /expense
          method: post
  deleteTransaction:
    handler: src/handlers/expense/expense.deleteTransaction
    events:
      - httpApi:
          path: /deleteTransaction/{id}
          method: delete
  addIncome:
    handler: src/handlers/income/income.addIncome
    events:
      - httpApi:
          path: /income
          method: post

resources:
  Resources:
    userTable:
      Type: "AWS::DynamoDB::Table"
      DeletionPolicy: Retain
      Properties:
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.userTableName}

    expenseTable:
      Type: "AWS::DynamoDB::Table"
      DeletionPolicy: Retain
      Properties:
        AttributeDefinitions:
          - AttributeName: userEmail
            AttributeType: S
        KeySchema:
          - AttributeName: userEmail
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.expenceTableName}

    incomeTable:
      Type: "AWS::DynamoDB::Table"
      DeletionPolicy: Retain
      Properties:
        AttributeDefinitions:
          - AttributeName: userEmail
            AttributeType: S
        KeySchema:
          - AttributeName: userEmail
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.incomeTableName}
